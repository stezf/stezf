<svg xmlns="http://www.w3.org/2000/svg" viewBox="65 -50 1500 568" width="100%" preserveAspectRatio="xMidYMid meet">
  <!-- Code panel, centered by coordinates instead of align="center". Same
       system as header.svg / about-title.svg: a 1500 wide viewBox
       with the panel drawn centered at x=750, so the image can be width="100%"
       and still land centered without depending on the HTML.

       GitHub sanitizes inline style=, so a ``` block cannot be painted in
       #568eff: GitHub's highlighting uses its own palette. As an image the
       colors are exact and match the banner:
         key      #7aa5ff  (the #568eff brand blue lightened for dark backgrounds)
         value    #cddafffa (same as the banner title)
         punct    #66709c  (blue-grey, so the structure does not shout)

       MEASUREMENTS: the panel is 1250 of 1500 -> 83% of the width, about 742px
       on an 890px column. The text is centered inside it: the longest line
       ("role", 47 chars) takes ~874 units, leaving ~188 on each side (111px
       real).

       HEIGHT: 568 of canvas for a 470 panel. It used to be 710/586: the whole
       block was shortened 20% so it does not dominate the profile on phones.
       The 20% comes from the leading and the padding, NOT from the type: the
       mono stays at 31 so the mobile size does not get worse (it is already
       the smallest text on the page). Line step 40 for a 31 font (1.29).

       EDITING: each line is its own <text> with an explicit y, 40 apart, so
       adding or removing a line does not break the spacing as long as you
       renumber the rest. When adding lines, also raise the viewBox and <rect>
       height (+40 per line). -->

  <style>
    .mono{ font-family: ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas,
           'DejaVu Sans Mono', monospace; font-size: 31px; }
    .k{ fill: #7aa5ff; }      /* key */
    .s{ fill: #cddafffa; }    /* value */
    .p{ fill: #66709c; }      /* { } [ ] : , */
    .f{ fill: #8b96bd; font-size: 26px; }
  </style>

  <defs>
    <!-- Ambient shadow, in the same tone as the banner (#030618). The canvas is
         568 tall for a 470 panel: that margin is what lets the blur (3 sigma =
         48 units) fit without the shadow being cut by the image edge. Region in
         userSpaceOnUse to control the filter area explicitly. -->
    <filter id="card-shadow" filterUnits="userSpaceOnUse"
            x="130" y="-60" width="1350" height="620">
      <feDropShadow dx="0" dy="10" stdDeviation="16"
                    flood-color="#030618" flood-opacity=".27"/>
    </filter>
  </defs>

  <!-- panel: centered at x=750 (750 - 1120/2 = 190) -->
  <rect x="190.5" y="1.5" width="1250" height="490" rx="25"
        fill="#1b203b" stroke="#568eff" stroke-opacity=".3"
        filter="url(#card-shadow)"/>

  <!-- terminal-style header -->
  <line x1="191" y1="70" x2="1450" y2="70" stroke="#568eff" stroke-opacity=".18"/>
  <circle cx="234" cy="30" r="9" fill="#568eff" fill-opacity=".9"/>
  <circle cx="274" cy="30" r="9" fill="#568eff" fill-opacity=".6"/>
  <circle cx="314" cy="30" r="9" fill="#568eff" fill-opacity=".35"/>
  <text class="mono f" x="353" y="39">aboutme.json</text>

  <!-- Content: one <text> per JSON line, with xml:space="preserve". That
       attribute is essential: without it SVG collapses the two indent spaces
       into one and the JSON looks crooked. Each <text> also sits on its own
       file line, because a newline inside <text> renders as a space. Every line
       adds 48 of height. -->
  <text class="mono" x="313" y="130" xml:space="preserve"><tspan class="p">{</tspan></text>
  <text class="mono" x="313" y="170" xml:space="preserve">  <tspan class="k">"user"</tspan><tspan class="p">: </tspan><tspan class="s">"Stezf"</tspan><tspan class="p">,</tspan></text>
  <text class="mono" x="313" y="210" xml:space="preserve">  <tspan class="k">"role"</tspan><tspan class="p">: </tspan><tspan class="s">"Backend &amp; System Design Developer"</tspan><tspan class="p">,</tspan></text>
  <text class="mono" x="313" y="250" xml:space="preserve">  <tspan class="k">"learning"</tspan><tspan class="s">: [C, Rust, Astro, Qt Quick],</tspan></text>
  <text class="mono" x="313" y="290" xml:space="preserve">  <tspan class="k">"currently-focus"</tspan><tspan class="p">: </tspan><tspan class="s">"GlaceShell"</tspan><tspan class="p">,</tspan></text>
  <text class="mono" x="313" y="330" xml:space="preserve">  <tspan class="k">"status"</tspan><tspan class="p">: </tspan><tspan class="s">"allways learning something new"</tspan><tspan class="p">,</tspan></text>
  <text class="mono" x="313" y="370" xml:space="preserve">  <tspan class="k">"machine"</tspan><tspan class="p">: </tspan><tspan class="s">"AMD Ryzen 5 8600G w/ 760M"</tspan><tspan class="p">,</tspan></text>
  <text class="mono" x="313" y="410" xml:space="preserve">  <tspan class="k">"tastes"</tspan><tspan class="p">: </tspan><tspan class="s">[Ricing, Hardware, Metrics, Tecnology]</tspan></text>
  <text class="mono" x="313" y="450" xml:space="preserve"><tspan class="p">}</tspan></text>
</svg>
