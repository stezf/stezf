<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 86" width="100%" preserveAspectRatio="xMidYMid meet">
  <!-- Section title: "user" icon + About Me.

       The icon comes from assets/icons/user.svg, COPIED inline: an SVG loaded
       with <img> renders in restricted mode and does not load external
       references, so <use href=...> or <image href=...> would render empty.
       The C2PA <metadata> (7.7 KB of base64) was dropped from the copy; the
       original file keeps its manifest.

       The icon carries its own gradient (#568eff -> #2f5fd6) and does NOT follow
       the text's theme: it is a shape filled with brand blue, readable on white
       and on black alike. That is why there is no .i class here.

       CAREFUL with the gradient: it needs a direction with length, x1!=x2 or
       y1!=y2. With x2="0" y2="0" the gradient flattens into a solid color.

       MEASUREMENTS (getBBox / getComputedTextLength, not by eye):
         icon user     content x=15..112  y=12..115  -> 98 x 104 (ratio 0.94)
         scale 0.5     -> 52 tall, like the other title icons, and 49 wide
         translate     -> ink at x=0 (where the dot was) and its top at y=26,
                          same as Tool Box
         text          "About Me" advance = 269.28px, center at x=203.6
                          -> its box starts at 69 = 49 of icon + 20 of air
         NOTE: this text starts at x=69 and Tool Box's at 72.9 because each icon
         has a different width. Aligning every title would need a common icon
         width with the height left free.

       ROTATION: rotate(-16), 16 degrees left, around the icon's center. Note the
       rotated icon box grows from 49x52 to 60.8x62.9, so the translate above no
       longer holds: the center moved to (60.8/2, 51.75) to keep the ink at x=0
       and in the same vertical band, and the text shifted +6.16 (the same as
       the icon center) to keep the 20 of air. The rotated height (20.3..83.2)
       just fits the 86 tall viewBox. -->

  <style>
    .t{
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 60px;
      font-weight: 600;
      letter-spacing: -0.5px;
      text-anchor: middle;
      fill: #568eff;
    }
    @media (prefers-color-scheme: dark){
      .t{ fill: #bdcaf0fa; }
    }
  </style>

  <defs>
    <linearGradient id="user-grad" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#568eff"/>
      <stop offset="1" stop-color="#2f5fd6"/>
    </linearGradient>
  </defs>

