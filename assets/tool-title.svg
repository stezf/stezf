<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -40 1500 141" width="100%" preserveAspectRatio="xMidYMid meet">
  <!-- Section title: "tool" icon + Tool Box. Same recipe as about-title.svg so
       both titles read as one family: 52 tall icon anchored at x=0, text with
       20 of air.

       The icon comes from assets/icons/tool.svg, COPIED inline because an SVG
       loaded with <img> cannot reference external files. The copy dropped the
       C2PA <metadata> (7.7 KB of base64) and its fixed #bdcaf0 fill; the original
       file keeps its manifest. The icon is now painted with its own gradient,
       the same one user.svg's icon uses (#568eff -> #2f5fd6), and no longer
       depends on the theme.

       MEASUREMENTS (getComputedTextLength / getBBox, not by eye):
         icon tool   content x=6..121  y=7..120  -> 116 x 114, nearly square
                      (info's was 53 x 119, very vertical)
         scale 0.456 -> 52 tall, like About Me's icon, and 52.9 wide
         translate   -> ink at x=0 (where the dot was) and top at y=26, same as
                       About Me's icon
         text        "Tool Box" advance = 248.18px, center at x=197
                      -> its box starts at 72.9 = 52.9 of icon + 20 of air
         NOTE: About Me's text starts at x=69 and this one at 72.9 because each
         icon has a different width. Aligning the words of both titles would
         need a common icon width with the height left free.

       ROTATION: rotate(-10), 10 degrees left, around the icon's center. The
       rotated box grows from 52.9x52 to 60.6x59.9, so the translate above was
       recomputed: the center sits at (32.31, 51.77), which puts the ink at
       x=2.0..62.6 (about 2 units in, no longer flush at 0: 1.2px at 890 wide)
       and y=21.8..81.7, inside the 86 tall band. The text keeps the
       +6.09 shift that came with the rotation.

       SECTION AIR: the viewBox is 40 units taller than that band, 40 at
       the TOP (y=-40 to 86), and that is the only separation between
       sections. It used to be a <br><br><br> in the README: 72px fixed,
       taller than this whole title on a phone. Now it scales with the
       image: 24px at 890 wide, 9px at 343.

       RULE: the divider that used to be assets/rule.svg is drawn here, at
       y=91.5..94.5, 5.5 below the 86 band. Title and line are one image,
       so each section loses one paragraph margin (16px) plus the 6 units
       of air the standalone rule had: 21px less at 890 wide, 18px at 343. -->

  <style>
    .t{
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 60px;
      font-weight: 600;
      letter-spacing: -0.5px;
      text-anchor: middle;
      fill: #bdcaf0fa;
    }

    @media (prefers-color-scheme: dark){
      .t{ fill: #bdcaf0fa; }
    }
  </style>

  <defs>
    <!-- Same gradient as user.svg's icon: brand blue top to bottom. NOTE:
         x1!=x2 or y1!=y2, or the gradient flattens to a solid color. -->
    <linearGradient id="tool-grad" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#568eff"/>
      <stop offset="1" stop-color="#2f5fd6"/>
    </linearGradient>
    <linearGradient id="rule-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="33%" stop-color="#568eff" stop-opacity=".5"/>
    </linearGradient>
  </defs>

  <g transform="translate(32.31 51.77) rotate(-10) scale(0.456) translate(-63.5 -63.5)">
