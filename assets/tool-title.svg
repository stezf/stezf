  </g>

  <text class="t" x="319.09" y="75">Stack &amp; Tool Box</text>
  <!-- Divider. It used to be assets/rule.svg; it lives here now so the gap
       between the title and the line is one paragraph margin, not two. -->
  <rect x="0" y="91.5" width="1500" height="3" fill="url(#rule-grad)"
        shape-rendering="crispEdges"/>
</svg>