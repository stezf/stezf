<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 526" width="100%" preserveAspectRatio="xMidYMid meet">
  <!-- TEMPLATE for the projects section. NOT referenced from the README: what
       shows on the profile is assets/projects.svg, generated by
       scripts/gen_projects.py filling in the placeholders below.

       PLACEHOLDERS (replaced by scripts/gen_projects.py):
         HEIGHT       total canvas height, in user units
         CARDS      one card per repo
         GENERATED   generation date, for traceability only
       They are quoted here WITHOUT braces on purpose: the generator uses
       str.replace, which hits every occurrence, so a literal token in this
       comment would get the cards written inside it. The generator checks that
       each placeholder appears exactly once and fails otherwise.

       THIS CANNOT BE DONE IN THE BROWSER. The README is served as sanitized
       HTML: <script> comes out ESCAPED and style= is REMOVED (verified with the
       GitHub API's POST /markdown). And an SVG loaded with <img> renders in
       restricted mode: no scripts, no external resources. So no fetch is
       possible at render time and the data arrives baked in.

       GRID: two columns. Card width (1500 - 2x40 margin - 40 gap) / 2 = 690.
       Two description lines are always reserved so that every card ends up the
       same height and the grid reads as one block. ULTIMA_OCUPA_AMBAS_COLUMNAS
       in the generator decides what the odd card out does: left at half width
       it leaves a gap in the last row, turned on it spans both columns.

       THEME: prefers-color-scheme, like the rest of the profile SVGs. Note it
       follows the SYSTEM theme, not GitHub's theme toggle: an <img> gets no
       page theme information.

       DARK CARD COLOR: #2e3866, measured against GitHub's real dark background
       (#0d1117) rather than picked by eye. Opaque it only reached 1.25x and the
       border ended up doing all the work of drawing the card.

       BUT THE CARD IS TRANSLUCENT (fill-opacity .4), so the number that matters
       is the one of the composited result, which is much lower than the opaque
       one, and the border was raised from .45 to .65 to compensate. Measured
       with the fill at 40% over the dark background:

         card fill #2e3866 at 40% over #0d1117 -> #1a2137,  1.19x
         name  #e6edf3 on that result            13.50x
         desc   #b3bcc9 on that result            8.32x
         lang   #8a94a3 on that result            5.20x   (WCAG AA needs 4.5x)

       The fill barely separates from the background on purpose: the card reads
       as a tinted pane with a defined edge rather than as a block of colour.
       The text is unaffected, well above the 4.5x WCAG AA threshold. The light
       fill (#fafafa at 40% over white) lands at 1.02x, which is even flatter,
       and the same border carries it. -->

  <style>
    .card{
      fill: #fafafa;
      stroke: #3a416a;
      stroke-opacity: .38;
      stroke-width: 2;
      /* Translucent: at 40% the page background shows through, and the border
         does the work of drawing the outline. */
      fill-opacity: .4;
    }
    .name{
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 46px;
      font-weight: 700;
      letter-spacing: -.5px;
      fill: #1b203b;
    }
    .desc{
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 29px;
      fill: #4a5568;
    }
    .lang{
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 27px;
      fill: #858b98;
      fill-opacity: .725;
    }
    @media (prefers-color-scheme: dark){
      .card{ fill: #2e3866; stroke-opacity: .65; }
      .name{ fill: #e6edf3; }
      .desc{ fill: #b3bcc9; }
      .lang{ fill: #8a94a3; }
    }
  </style>

  <defs>
    <!-- Card shadow: #080808 at 39%. The chips use 19%; doubled here so the
         card stands off the page. -->
    <filter id="card-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5"
                    flood-color="#080808" flood-opacity=".39"/>
    </filter>
  </defs>

    <g>
      <rect class="card" x="40" y="0" width="690" height="236" rx="16" filter="url(#card-shadow)"/>
      <text class="name" x="76" y="62">GlaceShell</text>
      <text class="desc" x="76" y="112">A Modern Glassmorphic shell</text>
      <text class="desc" x="76" y="152">interface for Wayland/KDE Plasma</text>
      <circle cx="85" cy="193" r="9" fill="#44a51c"/>
      <text class="lang" x="108" y="202">QML</text>
    </g>
    <g>
      <rect class="card" x="770" y="0" width="690" height="236" rx="16" filter="url(#card-shadow)"/>
      <text class="name" x="806" y="62">RobloxVerify</text>
      <text class="desc" x="806" y="112">Bash + systemd service that monitors Roblox</text>
      <text class="desc" x="806" y="152">user presence and pushes ntfy.sh notificati...</text>
      <circle cx="815" cy="193" r="9" fill="#89e051"/>
      <text class="lang" x="838" y="202">Shell</text>
    </g>
    <g>
      <rect class="card" x="40" y="270" width="690" height="236" rx="16" filter="url(#card-shadow)"/>
      <text class="name" x="76" y="332">BingR-Bot</text>
      <text class="desc" x="76" y="382">BingR-Bot: Automate bing browser searchs.</text>
      <circle cx="85" cy="463" r="9" fill="#3572A5"/>
      <text class="lang" x="108" y="472">Python</text>
    </g>

  <!-- Generated 2026-10-26 12:55 UTC by scripts/gen_projects.py from the GitHub API.
       Do not edit by hand: the weekly workflow overwrites it. -->
</svg>
