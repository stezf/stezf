<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -40 1500 141" width="100%" preserveAspectRatio="xMidYMid meet">
  <!-- Section title: "github" icon + Github Stats.

       The icon comes from assets/icons/github.svg, COPIED inline: an SVG loaded
       with <img> renders in restricted mode and does not load external
       references, so <use href=...> or <image href=...> would render empty.
       The C2PA <metadata> (7.7 KB of base64) was dropped from the copy; the
       original file keeps its manifest.
       The icon already carries its own gradient (#568eff -> #2f5fd6) and does
       NOT follow the theme: a shape filled with brand blue, readable on white
       and on black alike.

       CAREFUL with the gradient: it needs a direction with length, x1!=x2 or
       y1!=y2. With x2="0" y2="0" the gradient flattens into a solid color.

       MEASUREMENTS (getBBox / getComputedTextLength, not by eye):
         icon github   content x=14.61..113.66  y=9.20..118.75 -> 99 x 109.55
         scale 0.4747  -> 52 tall, like the other icons, and 47 wide
         translate     -> ink at x=0 (where the dot was) and top at y=26
         text          "Github Stats" advance = 350.65px
                          -> center at x=242.4, its box starts at 67
                             = 47 of icon + 20 of air

       ROTATION: rotate(-10), 10 degrees left, around the icon's center. The
       rotated box grows from 47x52 to 55.3x59.4, so the translate above was
       recomputed: the center sits at (29.77, 52), which puts the ink at
       x=2.1..57.4 (about 2 units in, no longer flush at 0: 1.2px at 890 wide)
       and y=22.3..81.7, inside the 86 tall band. The text keeps the
       +6.26 shift that came with the rotation.

       SECTION AIR: the viewBox is 40 units taller than that band, 40 at
       the TOP (y=-40 to 86), and that is the only separation between
       sections. It used to be a <br><br><br> in the README: 72px fixed,
       taller than this whole title on a phone. Now it scales with the
       image: 24px at 890 wide, 9px at 343.

       RULE: the divider that used to be assets/rule.svg is drawn here, at
       y=91.5..94.5, 5.5 below the 86 band. Title and line are one image,
       so each section loses one paragraph margin (16px) plus the 6 units
       of air the standalone rule had: 21px less at 890 wide, 18px at 343. -->

  <style>
    .t{
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 60px;
      font-weight: 600;
      letter-spacing: -0.5px;
      text-anchor: middle;
      fill: #568eff;
    }
    @media (prefers-color-scheme: dark){
      .t{ fill: #bdcaf0fa; }
    }
  </style>

  <defs>
    <linearGradient id="github-grad" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#568eff"/>
      <stop offset="1" stop-color="#2f5fd6"/>
    </linearGradient>
    <linearGradient id="rule-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="33%" stop-color="#568eff" stop-opacity=".5"/>
    </linearGradient>
  </defs>

