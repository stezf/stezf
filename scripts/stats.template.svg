<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 {{ALTO}}" width="100%" preserveAspectRatio="xMidYMid meet">
  <!-- TEMPLATE for the stats section. NOT referenced from the README: what shows
       on the profile is assets/stats.svg, generated by scripts/gen_stats.py
       filling in the placeholders below.

       PLACEHOLDERS (replaced by the generator, quoted here WITHOUT braces for
       the same reason as in gen_projects.py: str.replace hits every occurrence):
         ALTO      canvas height
         RESUMEN   the numbers line at the top
         AREA      fill under the curve
         CURVA     the curve
         MESES     month labels above the matrix
         MATRIZ    the cells
         LEYENDA   the less-to-more scale
         GENERADO  date, traceability only

       DATA SOURCE: https://github.com/users/stezf/contributions, the internal
       endpoint GitHub's own site uses to paint the profile graph. Not the public
       API and undocumented. Each day is a
       <td data-date="YYYY-MM-DD" data-level="0..4"> and the exact count sits in
       that day's <tool-tip for="...">, matched by id.

       RANGE: requested with NO parameters. from/to do not narrow it down (only
       the year of 'from' counts, so asking for 6 months returns 12); with no
       params it returns the rolling last-year window, already aligned Sunday to
       Saturday, and the generator crops it locally.

       IF GITHUB CHANGES THE MARKUP: the generator checks it read the expected
       number of days and that enough of them have count tooltips. On mismatch
       it fails and does NOT touch assets/stats.svg, so the profile never shows a
       blank section.

       MATRIX: 27 weeks (6 months), pitch 44, cell 36, from x=100 to x=1288.
       Month labels are NOT placed on column boundaries (the 1st can fall inside
       the week that started the previous month), so the generator finds the
       exact day of the change and labels the column containing it.

       CELL COLOR BY CLASS, not only by attribute: a CSS declaration always beats
       a presentation attribute, so the same rect changes with the theme without
       generating the matrix twice. The fill attribute stays as a fallback for
       renderers that do not apply CSS.

       CAREFUL editing the theme block: rules n0 to n4 must exist on both sides.
       They were lost once when a text replace swallowed the block mid-edit and
       the CSS stayed valid, rendering light colors in dark mode. Edit the whole
       block and check the render in both themes. -->

  <style>
    .num{
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 34px;
      font-weight: 700;
      fill: #1b203b;
    }
    .lab{
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 34px;
      font-weight: 400;
      fill: #6b7280;
    }
    .mes{
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 26px;
      font-weight: 500;
      fill: #6b7280;
    }
    .dia{
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 22px;
      fill: #9aa4b2;
    }
    .sep{
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 34px;
      fill: #c2c9d4;
    }
    .esc{
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 24px;
      fill: #6b7280;
    }
    .curva{
      fill: none;
      stroke: #568eff;
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .cuadrado{ rx: 6; }
    .n0{ fill: #e8ecf1; }
    .n1{ fill: #1a3a6b; }
    .n2{ fill: #24509e; }
    .n3{ fill: #2f6ad0; }
    .n4{ fill: #568eff; }

    @media (prefers-color-scheme: dark){
      .num{ fill: #e6edf3; }
      .lab{ fill: #8a94a3; }
      .mes{ fill: #8a94a3; }
      .dia{ fill: #6e7781; }
      .sep{ fill: #3d4757; }
      .esc{ fill: #8a94a3; }
      .n0{ fill: #1b2233; }
      .n1{ fill: #1b3257; }
      .n2{ fill: #21468f; }
      .n3{ fill: #2a5cb8; }
      .n4{ fill: #568eff; }
    }
  </style>

  <defs>
    <!-- Fill under the curve: the brand blue fades downward, the opposite of
         GitHub's graph, so the line leads and the area only anchors it. -->
    <linearGradient id="stats-area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#568eff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#568eff" stop-opacity="0"/>
    </linearGradient>
  </defs>

{{RESUMEN}}

  <path fill="url(#stats-area)" d="{{AREA}}"/>
  <path class="curva" d="{{CURVA}}"/>

{{MESES}}

{{MATRIZ}}

{{LEYENDA}}

  <!-- Generated {{GENERADO}} by scripts/gen_stats.py. Do not edit by hand: the
       weekly workflow overwrites it. -->
</svg>
