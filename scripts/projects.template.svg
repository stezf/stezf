<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 {{ALTO}}" width="100%" preserveAspectRatio="xMidYMid meet">
  <!-- TEMPLATE for the projects section. NOT referenced from the README: what
       shows on the profile is assets/projects.svg, generated by
       scripts/gen_projects.py filling in the placeholders below.

       PLACEHOLDERS (replaced by scripts/gen_projects.py):
         ALTO       total canvas height, in user units
         CARDS      one card per repo
         GENERADO   generation date, for traceability only
       They are quoted here WITHOUT braces on purpose: the generator uses
       str.replace, which hits every occurrence, so a literal token in this
       comment would get the cards written inside it. The generator checks that
       each placeholder appears exactly once and fails otherwise.

       THIS CANNOT BE DONE IN THE BROWSER. The README is served as sanitized
       HTML: <script> comes out ESCAPED and style= is REMOVED (verified with the
       GitHub API's POST /markdown). And an SVG loaded with <img> renders in
       restricted mode: no scripts, no external resources. So no fetch is
       possible at render time and the data arrives baked in.

       GRID: two columns. Card width (1500 - 2x40 margin - 40 gap) / 2 = 690.
       With an odd repo count the last card spans both columns (1420 wide) so
       the row has no gap. Two description lines are always reserved, even on
       the wide card, so every card has the same height and the grid reads as
       one block.

       THEME: prefers-color-scheme, like the rest of the profile SVGs. Note it
       follows the SYSTEM theme, not GitHub's theme toggle: an <img> gets no
       page theme information.

       DARK CARD COLOR: #2e3866, measured against GitHub's real dark background
       (#0d1117) rather than picked by eye. #20253b only reached 1.25x and was
       left to the 45% border to draw the card (1.51x composite). #2e3866 lifts
       the fill to 1.69x, readable without shouting, and the text still fits:

         card #2e3866 vs background #0d1117   1.69x
         name  #e6edf3 on the card           9.49x   (WCAG AA needs 4.5x)
         desc  #b3bcc9 on the card           5.85x   (WCAG AA needs 4.5x)

       Not higher because #323d70 reaches 1.84x but from there the card blue
       competes with the text and the chips. The light fill (#f6f8fa) is left
       alone: there the border does the same job. -->

  <style>
    .card{
      fill: #fafafa;
      stroke: #3a416a;
      stroke-opacity: .38;
      stroke-width: 2;
      /* Translucida: al 40% deja pasar el fondo de la pagina, y el borde hace
         el trabajo de dibujar el contorno. */
      fill-opacity: .4;
    }
    .name{
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 46px;
      font-weight: 700;
      letter-spacing: -.5px;
      fill: #1b203b;
    }
    .desc{
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 29px;
      fill: #4a5568;
    }
    .lang{
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 27px;
      fill: #858b98;
      fill-opacity: .725;
    }
    @media (prefers-color-scheme: dark){
      .card{ fill: #2e3866; stroke-opacity: .65; }
      .name{ fill: #e6edf3; }
      .desc{ fill: #b3bcc9; }
      .lang{ fill: #8a94a3; }
    }
  </style>

  <defs>
    <!-- Card shadow: #080808 at 39%. Chips use 19%; doubled here so the card
         stands off the page. -->
    <filter id="card-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5"
                    flood-color="#080808" flood-opacity=".39"/>
    </filter>
  </defs>

{{CARDS}}

  <!-- Generated {{GENERADO}} by scripts/gen_projects.py from the GitHub API.
       Do not edit by hand: the weekly workflow overwrites it. -->
</svg>
